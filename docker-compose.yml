
services:

  nats-server:
    image: nats:latest
    ports:
      - "8222:8222"

  client-gateway:
    build: 
      context: ./client-gateway
      dockerfile: dockerfile
    container_name: client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    environment:
      - PORT=3000
      # OJO: localhost no funcionará si no tienes NATS en tu PC, 
      # pero por ahora dejémoslo para que no dé error de sintaxis.
      - NATS_SERVERS=${NATS_SERVERS}
    # MODO WATCH (La clave para Windows)
    develop:
      watch:
        - action: sync
          path: ./client-gateway/src
          target: /usr/src/app/src
          ignore:
            - node_modules
    command: npm run start:dev

  products-ms:
    build:
      context: ./products-ms
      dockerfile: dockerfile
    container_name: products-ms
    environment:
      - PORT=3001
      - DATABASE_URL=file:./dev.db
      - NATS_SERVERS=${NATS_SERVERS}
    develop:
      watch:
        - action: sync
          path: ./products-ms/src
          target: /usr/src/app/src
          ignore: 
            - node_modules
    command: npm run start:dev
    # docker compose up --build -> Activar el modo watch pulsando la tecla W

  orders-db:
    container_name: orders_database_network
    image: postgres:16.2
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ordersdb
    # Usamos volumen con nombre para mayor eficiencia en el disco
    volumes:
      - orders_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  orders-ms:
    build:
      context: ./orders-ms
      dockerfile: dockerfile
    container_name: orders-ms
    depends_on:
      - nats-server
      - orders-db
    environment:
      - PORT=3002
      # CORRECCIÓN: Apuntar al nombre del servicio en la red de Docker
      - NATS_SERVERS=${NATS_SERVERS}
      # CORRECCIÓN: El host de la DB es 'orders-db', NO 'nats-server'
      - DATABASE_URL=postgresql://postgres:postgres@orders-db:5432/ordersdb?schema=public
    develop:
      watch:
        - action: sync
          path: ./orders-ms/src
          target: /usr/src/app/src
          ignore:
            - node_modules
    command: npm run start:dev

# =====================
# Payments microservice
# =====================
  payments-ms:
    ports:
      - ${PAYMENTS_MS_PORT}:${PAYMENTS_MS_PORT}
    build:
      context: ./payments-mshyb
      dockerfile: dockerfile
    container_name: payments-ms
    environment:
      - NATS_SERVERS=${NATS_SERVERS}
      - PORT=${PAYMENTS_MS_PORT}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}
    develop:
      watch:
        - action: sync
          path: ./payments-mshyb/src
          target: /usr/src/app/src
          ignore:
            - node_modules
    command: npm run start:dev

  auth-ms:
    build: 
      context: ./auth-ms
      dockerfile: dockerfile
    container_name: auth-ms
    environment:
        - DATABASE_URL=${DATABASE_URL}
        - NATS_SERVERS=${NATS_SERVERS}
        - JWT_SECRET=${JWT_SECRET}
    # MODO WATCH (La clave para Windows)
    develop:
      watch:
        - action: sync
          path: ./auth-ms/src
          target: /usr/src/app/src
          ignore:
            - node_modules
    command: npm run start:dev


# Definición de volúmenes para evitar que el archivo .vhdx crezca con basura
volumes:
  orders_data:
